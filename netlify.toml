# Netlify: plain static site, no build step. Publishes the repo root.
[build]
  publish = "."
  command = ""

# The Firebase web API key in js/config.js is public by design (Firebase rules protect the data),
# so tell Netlify's secret scanner it's safe. Otherwise the deploy fails with "Exposed secrets detected".
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyD1RK2hFxTPc5fLjGmay2oohyTl8Ut1AaA"

# The study tutor: netlify/functions/tutor.mjs at /api/tutor. Needs ANTHROPIC_API_KEY in Site configuration → Environment
# variables. esbuild bundles its imports (netlify/lib, js/config.js, content/motivation.js) — the site itself still has no build.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Always fetch fresh app code so updates show up right away.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
